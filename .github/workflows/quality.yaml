name: SDK quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: sdk-quality-${{ github.workflow }}-${{ github.ref }}
  # Serialize main validation/publication; superseded PR checks can be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            testbench: '^10.0'
            dependencies: prefer-lowest
          - php: '8.3'
            testbench: '^10.0'
            dependencies: prefer-stable
          - php: '8.4'
            testbench: '^11.0'
            dependencies: prefer-lowest
          - php: '8.4'
            testbench: '^11.0'
            dependencies: prefer-stable
    name: PHP ${{ matrix.php }} / Testbench ${{ matrix.testbench }} / ${{ matrix.dependencies }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, dom, pdo_sqlite
          coverage: none
          tools: composer:v2
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
      - name: Validate Composer manifest
        run: composer validate --strict
      - name: Resolve dependencies without changing the manifest
        env:
          TESTBENCH: ${{ matrix.testbench }}
          DEPENDENCIES: ${{ matrix.dependencies }}
        run: |
          flags=(--prefer-stable)
          if [[ "$DEPENDENCIES" == prefer-lowest ]]; then
            flags+=(--prefer-lowest)
          fi
          composer update --no-interaction --prefer-dist --with "orchestra/testbench:$TESTBENCH" "${flags[@]}"
      - name: Tests (only two real backend fixture sync tests excluded)
        run: |
          test "$(id -u)" -ne 0
          php -r 'exit(extension_loaded("intl") ? 0 : 1);'
          composer test -- --exclude-group=backend-fixture-sync
      - name: Static analysis
        run: composer analyse -- --debug
      - name: Formatting validation
        # Lowest resolves Pint 1.0.0; enforce the current formatter on stable jobs.
        if: matrix.dependencies == 'prefer-stable'
        run: composer format -- --test

  automatic-release:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/release.yaml
